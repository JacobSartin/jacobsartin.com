allowBuilds:
  esbuild: true
# Match Renovate's cooldown, including packages pulled in indirectly.
minimumReleaseAge: 4320
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  "@tanstack/react-router":
    skills: true
  "@tanstack/react-start":
    skills: true
skills:
  dirs:
    - .agents/skills
