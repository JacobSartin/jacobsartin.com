name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A rebase replaces the earlier run for the same pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The merge gate. Every step depends only on the commit under test, so a
  # failure here always points at the change. Checks that depend on the outside
  # world, such as new advisories, run on a schedule in audit.yaml instead.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Check
        run: vp run check

      - name: Build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: vp run build
