name: Dependency graph

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Component Detection 8.0.5+ reads both pnpm 12 lockfile documents.
      # No dependency installation or package scripts are needed for this scan.
      - name: Submit resolved dependencies
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          filePath: frontend
          detectorsCategories: Npm
          fail-on-empty: true
          correlator: pnpm-frontend
