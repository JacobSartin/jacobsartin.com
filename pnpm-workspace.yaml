allowBuilds:
  esbuild: true
# Match Renovate's cooldown, including packages pulled in indirectly.
minimumReleaseAge: 4320
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  "@tanstack/react-router":
    skills: true
  "@tanstack/react-start":
    skills: true
skills:
  dirs:
    - .agents/skills
# setup-vp already installs the pnpm pinned by packageManager. Don't let pnpm
# manage its own version: that adds a packageManagerDependencies section to the
# lockfile that Renovate doesn't keep in sync, which breaks --frozen-lockfile.
pmOnFail: ignore
