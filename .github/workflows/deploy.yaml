name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Deploys run one at a time, in order.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Dependencies and project code run here, with a token that can only read.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      # A failure here stops the deploy; the site keeps the previous build.
      - name: Check
        run: vp run check

      - name: Build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: vp run build

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          # The build includes .nojekyll.
          include-hidden-files: true
          if-no-files-found: error

  # Only this job can write to the repository. It runs no project code.
  publish:
    needs: build
    environment:
      name: production
      url: https://jacobsartin.com
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Push the build to the site branch.
      contents: write

    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      # The site branch holds only the latest build, as a single commit; the web server
      # serves whatever it points to.
      - name: Publish to the site branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=site
          git add --all
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message="Build of ${GITHUB_SHA}"
          gh auth setup-git
          git push --force "https://github.com/${GITHUB_REPOSITORY}.git" site
