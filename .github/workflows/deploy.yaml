name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Deploys run one at a time, in order.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  # Push the build to the site branch.
  contents: write

jobs:
  deploy:
    environment:
      name: production
      url: https://jacobsartin.com
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          working-directory: frontend
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Build
        working-directory: frontend
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: vp run build

      # The site branch holds only the latest build, as a single commit; the web server
      # serves whatever it points to.
      - name: Publish to the site branch
        working-directory: frontend/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=site
          git add --all
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message="Build of ${GITHUB_SHA}"
          gh auth setup-git
          git push --force "https://github.com/${GITHUB_REPOSITORY}.git" site
