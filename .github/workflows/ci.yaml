name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          working-directory: frontend
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Check
        working-directory: frontend
        run: vp run check

      - name: Build
        working-directory: frontend
        run: vp run build
